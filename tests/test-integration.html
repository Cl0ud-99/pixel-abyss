<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>集成测试：WASD 与跟随相机切换</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #06122e; color: #cfe0ff; font: 12px ui-monospace, monospace; }
    #out { padding: 12px; white-space: pre; line-height: 1.8; }
    .ok { color: #4ade80; }
    .bad { color: #f87171; }
  </style>
</head>
<body>
  <div id="out">running…</div>
  <script type="module">
    import * as THREE from 'three';
    import { WhaleSwimmer, FollowCamera } from '../src/whaleAI.js';
    import { FreeFlyCamera } from '../src/freeCam.js';

    const lines = [];
    const log = (s) => lines.push(s);
    const ok = (c, label, detail = '') => log(`${c ? '✅' : '❌'} ${label}${detail ? '  ' + detail : ''}`);

    // 模拟 OrbitControls
    class FakeControls extends THREE.EventDispatcher {
      constructor() { super(); this.target = new THREE.Vector3(); this.enabled = true; }
      update() {}
    }

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(320, 200, false);
    document.body.appendChild(renderer.domElement);
    const canvas = renderer.domElement;

    const camera = new THREE.PerspectiveCamera(45, 1.6, 0.1, 500);
    const controls = new FakeControls();
    const root = new THREE.Group();

    const swimmer = new WhaleSwimmer({
      root, bounds: { x: 62, y: 20, z: 62 }, margin: 12,
      speed: 4.2, turnRate: 1.05, turnGain: 2.0, turnAccel: 2.4,
      minY: 2, maxY: 14,
    });
    const followCam = new FollowCamera(camera, controls, {
      distance: 18, height: 3.5, sideOffset: 0.85, lookAhead: 3,
    });

    let mode = '跟随中';
    const freeCam = new FreeFlyCamera(camera, canvas, {
      speed: 16, accel: 7, idleDelay: 0.5,
      bounds: { x: 70, z: 70 }, minY: -21, maxY: 36,
      onEnter: () => {
        controls.enabled = false;
        followCam.enabled = false;
        followCam.userInteracting = true;
        mode = '自由飞行';
      },
      onExit: () => {
        controls.enabled = true;
        followCam.userInteracting = false;
        followCam.enabled = false;
        followCam.idleTimer = 0;
        followCam._initialized = false;
        mode = '跟随中';
      },
    });

    const dt = 1 / 60;
    const press = (code) => window.dispatchEvent(new KeyboardEvent('keydown', { code, bubbles: true }));
    const release = (code) => window.dispatchEvent(new KeyboardEvent('keyup', { code, bubbles: true }));

    function frame() {
      swimmer.update(dt);
      freeCam.update(dt);
      if (freeCam.active) {
        if (freeCam.isIdle()) freeCam.exit();
      } else {
        followCam.update(dt, swimmer);
        if (!followCam.enabled) controls.update();
      }
    }
    const run = (sec) => { for (let i = 0; i < Math.round(sec / dt); i++) frame(); };

    // ── 1. 初始：跟随模式 ──
    run(2);
    ok(!freeCam.active && followCam.enabled, '初始为跟随模式');
    const followDist = camera.position.distanceTo(swimmer.pos);
    ok(followDist < 30, '相机跟上了鲸鱼', `距离 ${followDist.toFixed(1)}`);

    // ── 2. 按 W 进入自由飞行 ──
    press('KeyW');
    frame();
    ok(freeCam.active, '按 W 进入自由飞行');
    ok(controls.enabled === false, '自由飞行时 OrbitControls 被禁用');
    ok(followCam.enabled === false, '自由飞行时跟随被禁用');
    ok(mode === '自由飞行', 'HUD 模式切换为自由飞行');

    // ── 3. 自由飞行中相机不应被跟随逻辑拉走 ──
    run(1);
    release('KeyW');
    const camAfterFly = camera.position.clone();
    const whaleBefore = swimmer.pos.clone();
    // 鲸鱼继续游，但相机静止（不再被跟随）
    run(1);
    const camStill = camera.position.clone();
    const moved = camStill.distanceTo(camAfterFly);
    ok(moved < 2.5, '自由飞行时相机不被跟随逻辑拖走',
      `1 秒内位移 ${moved.toFixed(2)}（残余惯性）`);
    ok(swimmer.pos.distanceTo(whaleBefore) > 1, '鲸鱼仍在自主游动');

    // ── 4. 停手后自动交还 ──
    run(1.0);
    ok(!freeCam.active, '停手后自动退出自由飞行');
    ok(mode === '跟随中', 'HUD 模式恢复为跟随中');

    // ── 5. 恢复跟随后相机会重新靠拢鲸鱼 ──
    run(3);
    const recovered = camera.position.distanceTo(swimmer.pos);
    ok(recovered < 40, '相机恢复跟随鲸鱼', `距离 ${recovered.toFixed(1)}`);
    ok(followCam.enabled, '跟随状态已恢复');

    // ── 6. 再次按 A 能重新进入 ──
    press('KeyA');
    frame();
    ok(freeCam.active, '可以再次进入自由飞行');
    release('KeyA');

    // ── 7. 方向键也能用 ──
    run(1.0);
    press('ArrowUp');
    frame();
    ok(freeCam.active, '方向键也能触发自由飞行');
    release('ArrowUp');

    const passed = lines.filter((l) => l.startsWith('✅')).length;
    const failed = lines.filter((l) => l.startsWith('❌')).length;

    document.getElementById('out').innerHTML =
      lines.map((l) => `<div class="${l.startsWith('✅') ? 'ok' : l.startsWith('❌') ? 'bad' : ''}">${l}</div>`).join('') +
      `<div style="margin-top:12px">通过 ${passed} / ${passed + failed}</div>`;

    document.body.dataset.done = failed === 0 ? 'pass' : 'fail';
    window.__RESULT__ = { passed, failed };
  </script>
</body>
</html>
