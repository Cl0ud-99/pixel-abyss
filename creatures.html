<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>生物预览</title>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #0B1B57; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
    figure { margin: 0; position: relative; }
    figcaption { position: absolute; left: 8px; bottom: 6px; color: #CFE0FF; font: 11px ui-monospace, monospace; letter-spacing: .1em; opacity: .8; }
    canvas { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { VOXEL } from './src/voxel.js';
    import {
      buildClownfish, buildBlueTang, buildYellowFish, buildAngelfish,
      buildJellyfish, buildTurtle, buildOctopus, buildStarfish,
      buildCoral, buildSeagrass,
    } from './src/creatures.js';

    const list = [
      ['小丑鱼 clownfish', buildClownfish],
      ['蓝吊 blueTang', buildBlueTang],
      ['黄高鳍鱼 yellowFish', buildYellowFish],
      ['神仙鱼 angelfish', buildAngelfish],
      ['水母 jellyfish', buildJellyfish],
      ['海龟 turtle', buildTurtle],
      ['章鱼 octopus', buildOctopus],
      ['海星 starfish', buildStarfish],
      ['珊瑚 coral', () => buildCoral({ hue: 0 })],
      ['海草 seagrass', buildSeagrass],
    ];

    const W = 320, H = 260;

    for (const [label, build] of list) {
      const fig = document.createElement('figure');
      document.body.appendChild(fig);

      const renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      fig.appendChild(renderer.domElement);

      const cap = document.createElement('figcaption');
      cap.textContent = label;
      fig.appendChild(cap);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x12306E);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x223366, 2.4));
      const key = new THREE.DirectionalLight(0xffffff, 3.2);
      key.position.set(-8, 12, 14);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x9db8ff, 2.0);
      rim.position.set(10, 4, -12);
      scene.add(rim);

      const data = build();
      const root = new THREE.Group();

      for (const part of data.parts) {
        if (!part.voxels.length) continue;
        const colorOf = (kind) => {
          const hex = data.palette[kind] || data.palette.body || data.palette.main || '#888888';
          return new THREE.Color(hex).convertSRGBToLinear();
        };
        const geo = new THREE.BoxGeometry(VOXEL * 0.96, VOXEL * 0.96, VOXEL * 0.96);
        const mat = new THREE.MeshStandardMaterial({ flatShading: true, roughness: 0.6 });
        const mesh = new THREE.InstancedMesh(geo, mat, part.voxels.length);
        const m = new THREE.Matrix4();
        const q = new THREE.Quaternion();
        const p = new THREE.Vector3();
        const one = new THREE.Vector3(1, 1, 1);
        part.voxels.forEach((v, i) => {
          p.set(v.x * VOXEL, v.y * VOXEL, v.z * VOXEL);
          m.compose(p, q, one);
          mesh.setMatrixAt(i, m);
          mesh.setColorAt(i, colorOf(v.kind));
        });
        mesh.instanceMatrix.needsUpdate = true;
        mesh.instanceColor.needsUpdate = true;
        mesh.frustumCulled = false;

        const holder = new THREE.Group();
        holder.position.set(part.pivot[0] * VOXEL, part.pivot[1] * VOXEL, part.pivot[2] * VOXEL);
        const inner = new THREE.Group();
        inner.add(mesh);
        holder.add(inner);
        root.add(holder);
      }

      // 自动居中 + 适配相机
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      root.position.sub(center);
      scene.add(root);

      const maxDim = Math.max(size.x, size.y, size.z);
      const camera = new THREE.PerspectiveCamera(35, W / H, 0.01, 200);
      const dist = maxDim / (2 * Math.tan((35 * Math.PI) / 360)) * 1.55;
      camera.position.set(dist * 0.55, dist * 0.4, dist);
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
      fig.dataset.done = '1';
    }

    document.body.dataset.done = '1';
  </script>
</body>
</html>
